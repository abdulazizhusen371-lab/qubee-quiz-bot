<!DOCTYPE html>
<html>
<head>
  <title>This Week's Quiz</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #2c3e50;
    }
    .grade-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      max-width: 400px;
      margin: 30px auto;
    }
    .grade-btn {
      background: white;
      border: 2px solid #2c3e50;
      color: #2c3e50;
      padding: 30px 10px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }
    .grade-btn:hover {
      background: #2c3e50;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Select Your Grade</h1>

  <div class="grade-grid">
   <button class="grade-btn" style="opacity:0.4;" onclick="selectGrade(9)">Grade 9</button>
   <button class="grade-btn" style="opacity:0.4;" onclick="selectGrade(10)">Grade 10</button>
   <button class="grade-btn" style="opacity:0.4;" onclick="selectGrade(11)">Grade 11</button>
   <button class="grade-btn" onclick="selectGrade(12)">Grade 12</button>
  </div>

  <script>
    const enabledGrades = [12]; // only Grade 12 is active for now — add 9, 10, 11 here later when ready

function selectGrade(grade) {
  if (!enabledGrades.includes(grade)) {
    alert("This grade isn't available yet. Currently only Grade 12 is active.");
    return;
  }
  window.location.href = `subject-select.html?grade=${grade}`;
}
    if (window.Telegram && window.Telegram.WebApp) {
  Telegram.WebApp.BackButton.hide(); // no back button on the very first page
}
  </script>
</body>
</html>
