<!DOCTYPE html>
<html>
<head>
  <title>All Quizzes</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 { color: #2c3e50; }
    .grade-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      max-width: 400px;
      margin: 30px auto;
    }
    .grade-btn {
      background: white;
      border: 2px solid #2c3e50;
      color: #2c3e50;
      padding: 30px 10px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }
    .grade-btn:hover { background: #2c3e50; color: white; }
  </style>
</head>
<body>
  <h1>All Quizzes — Select Grade</h1>

  <div class="grade-grid">
    <button class="grade-btn" onclick="selectGrade(9)">Grade 9</button>
    <button class="grade-btn" onclick="selectGrade(10)">Grade 10</button>
    <button class="grade-btn" onclick="selectGrade(11)">Grade 11</button>
    <button class="grade-btn" onclick="selectGrade(12)">Grade 12</button>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.BackButton.hide();
    }

    function selectGrade(grade) {
      window.location.href = `archive-subject.html?grade=${grade}`;
    }
  </script>
</body>
</html>
