<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding-top: 80px; color: #2c3e50;">
  <p id="msg">Loading quiz...</p>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    const code = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
    const m = /^g(\d+)(bio|math|chem|phys)_u(\d+)$/.exec(code);

    if (m) {
      const [, grade, subject, unit] = m;
      window.location.replace(`archive-view.html?grade=${grade}&subject=${subject}&unit=${unit}&track=1`);
    } else {
      document.getElementById("msg").textContent =
        "This quiz link isn't valid. Please open the quiz from the channel post again.";
    }
  </script>
</body>
</html>
