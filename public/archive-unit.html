<!DOCTYPE html>
<html>
<head>
  <title>Select Unit</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 { color: #2c3e50; font-size: 22px; }
    .unit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 400px;
      margin: 30px auto;
    }
    .unit-btn {
      background: white;
      border: 2px solid #2c3e50;
      color: #2c3e50;
      padding: 20px 10px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1 id="pageTitle">Select a Unit</h1>

  <div class="unit-grid" id="unitGrid"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const grade = params.get("grade");
    const subject = params.get("subject");

    const subjectNames = { bio: "Biology", math: "Math", chem: "Chemistry", phys: "Physics" };
    const unitsPerSubject = { bio: 6, math: 5, chem: 5, phys: 5 };

    document.getElementById("pageTitle").textContent = `Grade ${grade} ${subjectNames[subject]} — Select Unit`;

    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.BackButton.show();
      Telegram.WebApp.BackButton.onClick(() => {
        window.location.href = `archive-subject.html?grade=${grade}`;
      });
    }

    const unitGrid = document.getElementById("unitGrid");
    const numUnits = unitsPerSubject[subject] || 5;

    for (let i = 1; i <= numUnits; i++) {
      const btn = document.createElement("button");
      btn.className = "unit-btn";
      btn.textContent = `Unit ${i}`;
      btn.onclick = () => {
        window.location.href = `archive-view.html?grade=${grade}&subject=${subject}&unit=${i}`;
      };
      unitGrid.appendChild(btn);
    }
  </script>
</body>
</html>
