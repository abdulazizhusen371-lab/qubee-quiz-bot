<!DOCTYPE html>
<html>
<head>
  <title>Select Subject</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 { color: #2c3e50; font-size: 22px; }
    .subject-list { max-width: 400px; margin: 30px auto; }
    .subject-btn {
      display: block;
      width: 100%;
      background: white;
      border: 2px solid #2c3e50;
      color: #2c3e50;
      padding: 18px 20px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <h1 id="gradeTitle">Select a Subject</h1>

  <div class="subject-list" id="subjectList"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const grade = params.get("grade");

    document.getElementById("gradeTitle").textContent = `Grade ${grade} — Select a Subject`;

    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.BackButton.show();
      Telegram.WebApp.BackButton.onClick(() => {
        window.location.href = "archive-grade.html";
      });
    }

    const subjects = [
      { id: "bio", name: "Biology" },
      { id: "math", name: "Math" },
      { id: "chem", name: "Chemistry" },
      { id: "phys", name: "Physics" },
    ];

    const subjectList = document.getElementById("subjectList");
    subjects.forEach((subject) => {
      const btn = document.createElement("button");
      btn.className = "subject-btn";
      btn.textContent = subject.name;
      btn.onclick = () => {
        window.location.href = `archive-unit.html?grade=${grade}&subject=${subject.id}`;
      };
      subjectList.appendChild(btn);
    });
  </script>
</body>
</html>
